services:
  proxy:
    build: 
      context: .
      dockerfile: proxy/Dockerfile.proxy
    ports:
      - "8080:8080"
    environment:
      - DOCKER_API_VERSION=1.47
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
  node:
    build:
      context: .
      dockerfile: node/Dockerfile.node
    deploy:
      replicas: 3
    labels:
      - "com.docker.compose.service=node" 
    depends_on:
      proxy:
        condition: service_healthy